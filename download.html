<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiwi Mission | Resources</title>
<meta name="description" content="Kiwi Mission resources: view or download the Kiwi Brochure, Flyer and Film.">
<meta name="theme-color" content="#0f2a19">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;1,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0b2114;--card:#13321f;--card2:#183c26;--line:rgba(243,241,228,.10);--lime:#a6d14a;--cream:#f3f1e4;--muted:#b7c7b0;--gold:#d9a441}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--cream);background:var(--night);
  background-image:radial-gradient(80% 50% at 50% 0%,#1f4d2d 0%,transparent 70%),linear-gradient(180deg,#0b2114,#0f2a19 60%,#0b1f13);
  min-height:100svh;display:flex;flex-direction:column}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,32px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.02em}
.brand svg{width:30px;height:30px}
.pill{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:10px 16px 40px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--lime)}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 10px}
h1 em{font-style:italic;font-weight:500;color:var(--lime)}
.sub{color:var(--muted);font-size:15.5px;line-height:1.6;max-width:460px;margin-top:10px}

.list{margin-top:26px;display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border-radius:18px;
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  transition:transform .15s,border-color .2s}
.item:active{transform:scale(.985)}
.item:hover{border-color:rgba(166,209,74,.45)}
.thumb{flex:none;width:76px;height:96px;border-radius:12px;overflow:hidden;position:relative;background:#0e2617;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb svg{width:44px;height:44px}
.info{flex:1;min-width:0}
.kind{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.info h2{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:700;margin:3px 0 4px}
.meta{font-size:13px;color:var(--muted)}
.soon-badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:rgba(217,164,65,.15);color:var(--gold);border:1px solid rgba(217,164,65,.35)}
.chev{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(166,209,74,.12);color:var(--lime)}
.chev svg{width:16px;height:16px}

.hint{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
footer{text-align:center;padding:16px 16px 26px;font-size:13px;color:var(--muted)}
footer a{text-decoration:none}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(3,10,6,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;
  background:#122e1c;border-top-left-radius:24px;border-top-right-radius:24px;border:1px solid var(--line);
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(243,241,228,.25);margin:0 auto 14px}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head .thumb{width:64px;height:82px}
.sheet h3{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:700;margin:2px 0 3px}
.sheet p.desc{color:var(--muted);font-size:14.5px;line-height:1.55;margin:14px 0 18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 14px;border-radius:14px;font-weight:800;font-size:15.5px;text-decoration:none}
.btn svg{width:19px;height:19px}
.btn.primary{background:var(--lime);color:#12301c}
.btn.ghost{border:1.5px solid rgba(166,209,74,.55);color:var(--cream)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.notice{margin-top:4px;padding:14px;border-radius:12px;background:rgba(217,164,65,.10);border:1px solid rgba(217,164,65,.3);color:#ecd3a1;font-size:14px;text-align:center}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:30;background:#08170e;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.viewer.on{opacity:1;pointer-events:auto}
.vbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#0f2618;border-bottom:1px solid var(--line)}
.vbar .t{flex:1;min-width:0}
.vbar .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .t small{font-size:12px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(243,241,228,.07)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.dl{background:var(--lime);color:#12301c}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.vbody img.page{width:100%;max-width:820px;border-radius:6px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.vbody video{width:100%;max-width:900px;border-radius:10px;background:#000;margin:auto 0}
.vbody img.single{max-width:100%;border-radius:8px;margin:auto 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <a class="brand" href="/" aria-label="Kiwi Mission home">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#6e4a26"/><circle cx="20" cy="20" r="16.5" fill="#8cc63f"/><circle cx="20" cy="20" r="6" fill="#f1f5d2"/><g fill="#1b1209"><ellipse cx="20" cy="10.5" rx=".9" ry="1.7"/><ellipse cx="20" cy="29.5" rx=".9" ry="1.7"/><ellipse cx="10.5" cy="20" rx="1.7" ry=".9"/><ellipse cx="29.5" cy="20" rx="1.7" ry=".9"/><ellipse cx="13.3" cy="13.3" rx=".9" ry="1.7" transform="rotate(-45 13.3 13.3)"/><ellipse cx="26.7" cy="26.7" rx=".9" ry="1.7" transform="rotate(-45 26.7 26.7)"/><ellipse cx="26.7" cy="13.3" rx=".9" ry="1.7" transform="rotate(45 26.7 13.3)"/><ellipse cx="13.3" cy="26.7" rx=".9" ry="1.7" transform="rotate(45 13.3 26.7)"/></g></svg>
    Kiwi Mission
  </a>
  <span class="pill">Resources</span>
</header>

<main>
  <div class="eyebrow">Kiwi Mission · Resources</div>
  <p class="sub">Tap a resource to view it right here, or save it to your phone.</p>

  <div class="list" id="list"></div>
  <p class="hint">More resources will be added here soon.</p>
</main>

<footer>© 2026 <a href="/">kiwimission.com</a></footer>

<!-- Bottom sheet -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sheet-head">
    <div class="thumb" id="sheetThumb"></div>
    <div>
      <div class="kind" id="sheetKind"></div>
      <h3 id="sheetTitle"></h3>
      <div class="meta" id="sheetMeta"></div>
    </div>
  </div>
  <p class="desc" id="sheetDesc"></p>
  <div class="actions" id="sheetActions">
    <button class="btn ghost" id="viewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="viewLabel">View</span>
    </button>
    <a class="btn primary" id="dlBtn" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download
    </a>
  </div>
  <div class="notice" id="sheetSoon" hidden>This will be available here soon. Please check back.</div>
</section>

<!-- Viewer -->
<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vbar">
    <button class="icon-btn" id="vClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="t"><b id="vTitle"></b><small id="vMeta"></small></div>
    <a class="icon-btn dl" id="vDl" download aria-label="Download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    </a>
  </div>
  <div class="vbody" id="vBody"></div>
</section>

<script>
/* ---- Edit this list to add or update resources ----
   kind: "pages" (PDF shown as page images), "image" (flyer), "video"
   Set available:true and fill file/src once the file is uploaded. */
var RESOURCES = [
  { id:'brochure', kind:'pages', label:'Brochure', title:'Kiwi Brochure',
    desc:'The complete kiwi brief with the field-level Package of Practices — climate, varieties, planting and orchard care.',
    meta:'PDF · 11 pages', pages:11, pagePath:'brochure-p-', file:'Arunachal-Kiwi-Brochure.pdf',
    downloadName:'Kiwi-Brochure.pdf', available:true },
  { id:'flyer', kind:'image', label:'Flyer', title:'Kiwi Flyer',
    desc:'A one-page snapshot of Kiwi Mission, easy to read and share.',
    meta:'Image · 1 page', src:'', file:'', downloadName:'Kiwi-Flyer.jpg', available:false },
  { id:'video', kind:'video', label:'Video', title:'Kiwi Film',
    desc:'A short film from the kiwi orchards of the highlands.',
    meta:'Video', src:'', poster:'', file:'', downloadName:'Kiwi-Film.mp4', available:false }
];

var ICONS = {
  image:'<svg viewBox="0 0 48 48" fill="none" stroke="#a6d14a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="32" height="36" rx="4"/><circle cx="18" cy="17" r="3.5"/><path d="M8 34l10-9 8 7 5-4 9 8"/></svg>',
  video:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="none" stroke="#a6d14a" stroke-width="2.4"/><path d="M20 16.5v15l12-7.5z" fill="#a6d14a"/></svg>',
  pages:'<svg viewBox="0 0 48 48" fill="none" stroke="#a6d14a" stroke-width="2.4" stroke-linecap="round"><path d="M12 6h17l9 9v27H12z"/><path d="M29 6v9h9M18 24h14M18 30h14M18 36h9"/></svg>'
};
function thumbHTML(r){
  if(r.kind==='pages' && r.available) return '<img src="'+r.pagePath+'01.jpg" alt="" loading="lazy">';
  if(r.kind==='image' && r.available && r.src) return '<img src="'+r.src+'" alt="" loading="lazy">';
  if(r.kind==='video' && r.available && r.poster) return '<img src="'+r.poster+'" alt="" loading="lazy">';
  return ICONS[r.kind];
}

var list=document.getElementById('list');
RESOURCES.forEach(function(r){
  var b=document.createElement('button');
  b.className='item'; b.setAttribute('aria-label','Open '+r.title);
  b.innerHTML='<div class="thumb">'+thumbHTML(r)+'</div>'+
    '<div class="info"><div class="kind">'+r.label+'</div><h2>'+r.title+'</h2>'+
    '<div class="meta">'+r.meta+'</div>'+(r.available?'':'<span class="soon-badge">Coming soon</span>')+'</div>'+
    '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>';
  b.addEventListener('click',function(){openSheet(r)});
  list.appendChild(b);
});

var $=function(id){return document.getElementById(id)};
var current=null;

function openSheet(r){
  current=r;
  $('sheetThumb').innerHTML=thumbHTML(r);
  $('sheetKind').textContent=r.label;
  $('sheetTitle').textContent=r.title;
  $('sheetMeta').textContent=r.meta;
  $('sheetDesc').textContent=r.desc;
  $('viewLabel').textContent = r.kind==='video' ? 'Watch' : 'View';
  $('sheetActions').hidden=!r.available;
  $('sheetSoon').hidden=r.available;
  if(r.available){ $('dlBtn').href=r.file; $('dlBtn').setAttribute('download',r.downloadName); }
  $('scrim').classList.add('on'); $('sheet').classList.add('on'); document.body.classList.add('lock');
  history.pushState({ui:'sheet'},'');
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); document.body.classList.remove('lock'); }

function openViewer(){
  var r=current; if(!r||!r.available) return;
  var body=$('vBody'); body.innerHTML='';
  $('vTitle').textContent=r.title; $('vMeta').textContent=r.meta;
  $('vDl').href=r.file; $('vDl').setAttribute('download',r.downloadName);
  if(r.kind==='pages'){
    for(var i=1;i<=r.pages;i++){
      var img=document.createElement('img'); img.className='page'; img.loading=i>2?'lazy':'eager';
      img.alt=r.title+' page '+i; img.src=r.pagePath+String(i).padStart(2,'0')+'.jpg'; body.appendChild(img);
    }
  } else if(r.kind==='image'){
    var im=document.createElement('img'); im.className='single'; im.src=r.src; im.alt=r.title; body.appendChild(im);
  } else if(r.kind==='video'){
    var v=document.createElement('video'); v.controls=true; v.playsInline=true; v.preload='metadata';
    if(r.poster) v.poster=r.poster; v.src=r.src; body.appendChild(v);
  }
  closeSheet();
  $('viewer').classList.add('on'); document.body.classList.add('lock'); body.scrollTop=0;
  history.replaceState({ui:'viewer'},'');
}
function closeViewer(){
  var v=$('vBody').querySelector('video'); if(v) v.pause();
  $('viewer').classList.remove('on'); document.body.classList.remove('lock');
}

$('viewBtn').addEventListener('click',openViewer);
$('scrim').addEventListener('click',function(){history.back()});
$('vClose').addEventListener('click',function(){history.back()});
window.addEventListener('popstate',function(){ closeSheet(); closeViewer(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && (document.querySelector('.sheet.on')||document.querySelector('.viewer.on'))) history.back(); });
</script>
</body>
</html>
