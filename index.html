<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiwi Mission | Coming Soon</title>
<meta name="description" content="Kiwi Mission — the seeds are sown. Something sweet is taking root. Coming soon.">
<meta name="theme-color" content="#0f2a19">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b2114; --lime:#a6d14a; --cream:#f3f1e4; --gold:#d9a441; --muted:#b7c7b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Manrope,system-ui,sans-serif;color:var(--cream);
  background:var(--night);
  background-image:
    radial-gradient(70% 60% at 50% 34%, #1f4d2d 0%, rgba(18,54,32,.6) 45%, transparent 75%),
    linear-gradient(180deg,#0b2114 0%,#0f2a19 60%,#0b1f13 100%);
  min-height:100svh;overflow-x:hidden;display:flex;flex-direction:column;
}
.hills{position:fixed;left:0;right:0;bottom:0;height:42vh;pointer-events:none;z-index:0}
.hills svg{width:100%;height:100%;display:block}
.mist{position:fixed;inset:auto 0 18vh 0;height:20vh;z-index:0;pointer-events:none;
  background:radial-gradient(60% 100% at 30% 50%,rgba(243,241,228,.08),transparent 70%),
             radial-gradient(50% 100% at 75% 60%,rgba(243,241,228,.06),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(4%)}}

header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
  padding:20px clamp(16px,4vw,40px);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:8px;
  box-shadow:0 0 0 0 rgba(166,209,74,.6);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(166,209,74,0)}100%{box-shadow:0 0 0 0 rgba(166,209,74,0)}}

main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 16px 40px}

/* Kiwi illustration */
.kiwi-wrap{position:relative;width:min(84vw,420px);aspect-ratio:420/340;margin-bottom:18px}
.kiwi-wrap:before{content:"";position:absolute;left:8%;right:8%;top:6%;bottom:6%;border-radius:50%;
  background:radial-gradient(circle,rgba(166,209,74,.26),transparent 64%);filter:blur(10px);animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{opacity:.55;transform:scale(1.05)}}
.kiwi{position:relative;width:100%;height:100%;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.kiwi svg{width:100%;height:100%;overflow:visible}
.leaf-sway{transform-box:fill-box;transform-origin:0% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-6deg)}}
.drop{animation:drip 4.5s ease-in infinite;transform-box:fill-box}
@keyframes drip{0%,55%{transform:translateY(0);opacity:0}62%{opacity:.9}100%{transform:translateY(46px);opacity:0}}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--lime);margin-bottom:14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(40px,10vw,84px);line-height:.98;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:500;color:var(--lime)}
.tag{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(18px,4.4vw,24px);color:#d9e8b8;margin-top:14px}
.lead{max-width:520px;margin:18px auto 0;color:var(--muted);font-size:16px;line-height:1.65}
.soon{display:inline-flex;align-items:center;gap:12px;margin-top:30px;padding:12px 22px;border-radius:999px;
  border:1px solid rgba(166,209,74,.45);background:rgba(166,209,74,.08);font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;font-size:13px}
.bar{width:90px;height:4px;border-radius:4px;background:rgba(243,241,228,.15);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--lime),var(--gold));
  animation:ripen 2.8s ease-in-out infinite}
@keyframes ripen{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

footer{position:relative;z-index:2;text-align:center;padding:18px 16px 26px;font-size:13px;color:var(--muted)}

@media (max-width:480px){.kiwi-wrap{margin-top:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="mist"></div>
<div class="hills" aria-hidden="true">
  <svg viewBox="0 0 1440 400" preserveAspectRatio="none">
    <path d="M0 230 L120 170 L230 210 L360 120 L470 190 L600 110 L720 180 L850 95 L980 175 L1110 120 L1230 185 L1340 140 L1440 175 V400 H0Z" fill="#14381f" opacity=".85"/>
    <path d="M0 290 L140 230 L280 280 L420 215 L560 275 L700 225 L840 285 L990 230 L1130 280 L1280 235 L1440 270 V400 H0Z" fill="#102d19"/>
    <path d="M0 340 Q180 300 360 335 T720 330 T1080 335 T1440 325 V400 H0Z" fill="#0b2114"/>
  </svg>
</div>

<header>
  <span><span class="dot"></span>kiwimission.com</span>
  <span>Coming soon</span>
</header>

<main>
  <div class="kiwi-wrap">
    <div class="kiwi">
      <svg viewBox="0 0 420 340" role="img" aria-label="A whole kiwi fruit and a freshly cut kiwi half">
        <defs>
          <!-- fuzzy skin -->
          <radialGradient id="wholeSkin" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#a77a48"/><stop offset="55%" stop-color="#7d5530"/><stop offset="100%" stop-color="#3f2812"/>
          </radialGradient>
          <filter id="fuzz" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="7" result="n"/>
            <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.70  0 0 0 0 0.48  0 0 0 1.4 -0.62" result="speck"/>
            <feComposite in="speck" in2="SourceGraphic" operator="in" result="fur"/>
            <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="fur"/></feMerge>
          </filter>
          <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
          <filter id="soft2"><feGaussianBlur stdDeviation="1.4"/></filter>
          <!-- cut face -->
          <radialGradient id="rind" cx="50%" cy="50%" r="50%">
            <stop offset="90%" stop-color="#d6e98f"/><stop offset="100%" stop-color="#6b4a26"/>
          </radialGradient>
          <radialGradient id="flesh" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f4f8d2"/>
            <stop offset="22%" stop-color="#cfe57a"/>
            <stop offset="45%" stop-color="#9fd043"/>
            <stop offset="78%" stop-color="#6fb52c"/>
            <stop offset="93%" stop-color="#7cbd33"/>
            <stop offset="100%" stop-color="#b9dc6a"/>
          </radialGradient>
          <radialGradient id="core" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#fffdf0"/><stop offset="70%" stop-color="#f1f5d2"/><stop offset="100%" stop-color="#d9eaa0" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity=".55"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6e4a26"/><stop offset="100%" stop-color="#3a2410"/>
          </linearGradient>
          <linearGradient id="leafG" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#2d6b2e"/><stop offset="100%" stop-color="#6fb544"/>
          </linearGradient>
          <linearGradient id="leafG2" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#245a27"/><stop offset="100%" stop-color="#4f9a3a"/>
          </linearGradient>
          <clipPath id="faceClip"><ellipse cx="0" cy="0" rx="118" ry="104"/></clipPath>
        </defs>

        <!-- ground shadow -->
        <ellipse cx="200" cy="312" rx="170" ry="16" fill="#000" opacity=".45" filter="url(#soft)"/>

        <!-- leaves behind -->
        <g class="leaf-sway">
          <path d="M300 92 C318 40 362 14 410 16 C398 66 356 96 300 92Z" fill="url(#leafG)"/>
          <path d="M300 92 C334 66 366 42 406 18" stroke="#b5dc6d" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/>
        </g>
        <path d="M296 96 C262 52 266 18 288 0 C314 30 316 68 296 96Z" fill="url(#leafG2)"/>
        <path d="M296 96 C288 62 286 30 288 2" stroke="#8cc05a" stroke-width="2" fill="none" opacity=".7"/>

        <!-- whole kiwi -->
        <g transform="rotate(-18 296 170)">
          <ellipse cx="296" cy="170" rx="104" ry="80" fill="url(#wholeSkin)" filter="url(#fuzz)"/>
          <ellipse cx="262" cy="134" rx="54" ry="22" fill="#e2c08f" opacity=".18" filter="url(#soft)"/>
          <ellipse cx="398" cy="172" rx="6" ry="8" fill="#3a2410"/>
          <circle cx="398" cy="172" r="2.4" fill="#1e1308"/>
        </g>

        <!-- cut half: side (thickness) -->
        <g transform="translate(160 196) rotate(-8)">
          <ellipse cx="0" cy="16" rx="126" ry="110" fill="url(#side)" filter="url(#fuzz)"/>
          <!-- rind -->
          <ellipse cx="0" cy="0" rx="126" ry="112" fill="url(#rind)"/>
          <!-- flesh -->
          <ellipse cx="0" cy="0" rx="118" ry="104" fill="url(#flesh)"/>
          <g clip-path="url(#faceClip)">
            <g id="fibres" stroke-linecap="round"></g>
            <ellipse cx="0" cy="0" rx="40" ry="34" fill="url(#core)"/>
            <g id="coreLines" stroke="#e9f2bf" stroke-width="1" opacity=".55"></g>
            <g id="seeds"></g>
            <!-- juicy gloss -->
            <path d="M-96 -40 C-80 -88 -30 -104 20 -100 C-30 -86 -66 -62 -86 -18Z" fill="url(#shine)"/>
            <ellipse cx="62" cy="58" rx="16" ry="6" transform="rotate(-35 62 58)" fill="#fff" opacity=".18"/>
          </g>
          <!-- juice drop -->
          <path class="drop" d="M-30 116 c0 0 -7 9 -7 14 a7 7 0 0 0 14 0 c0 -5 -7 -14 -7 -14z" fill="#b8e05c" opacity="0"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="eyebrow">Kiwi Mission</div>
  <h1>The seeds<br>are <em>sown.</em></h1>
  <div class="tag">Something sweet is taking root.</div>
  <p class="lead">Our website is seeding, sprouting and getting ready to bloom. Check back soon.</p>
  <div class="soon">Seeding <span class="bar"><i></i></span></div>
</main>

<footer>© 2026 kiwimission.com</footer>

<script>
(function(){
  var ns='http://www.w3.org/2000/svg';
  // seeded random so the fruit looks the same on every visit
  var s=42; function rnd(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }
  var RX=118, RY=104;
  function el(tag,attrs,parent){var e=document.createElementNS(ns,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}

  // fibrous rays radiating from the core
  var fib=document.getElementById('fibres');
  for(var i=0;i<140;i++){
    var a=i/140*Math.PI*2 + rnd()*0.03;
    var r0=36+rnd()*10, r1=(0.62+rnd()*0.33);
    el('line',{x1:Math.cos(a)*r0, y1:Math.sin(a)*r0*0.88, x2:Math.cos(a)*RX*r1, y2:Math.sin(a)*RY*r1,
      stroke: i%3? '#e8f5b0':'#5c9e25', 'stroke-width': (0.6+rnd()*1.1).toFixed(2), opacity:(0.18+rnd()*0.28).toFixed(2)},fib);
  }
  // radial lines inside core
  var cl=document.getElementById('coreLines');
  for(var j=0;j<26;j++){var a2=j/26*Math.PI*2; el('line',{x1:Math.cos(a2)*6,y1:Math.sin(a2)*5,x2:Math.cos(a2)*30,y2:Math.sin(a2)*25},cl);}

  // teardrop seeds in an irregular ring
  var sd=document.getElementById('seeds');
  var n=118;
  for(var k=0;k<n;k++){
    var a3=k/n*Math.PI*2 + (rnd()-0.5)*0.05;
    var rr=42+rnd()*24;
    var x=Math.cos(a3)*rr, y=Math.sin(a3)*rr*0.88;
    var len=7+rnd()*4.5, w=2.6+rnd()*1.3;
    var ang=a3*180/Math.PI + (rnd()-0.5)*18;
    var g=el('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+ang.toFixed(1)+')'},sd);
    el('path',{d:'M'+(-len*0.45)+' 0 C'+(-len*0.45)+' '+(-w)+' '+(len*0.55)+' '+(-w*0.6)+' '+(len*0.55)+' 0 C'+(len*0.55)+' '+(w*0.6)+' '+(-len*0.45)+' '+w+' '+(-len*0.45)+' 0Z',
      fill: rnd()>.25? '#160d05':'#2a1a0b'},g);
    el('ellipse',{cx:(-len*0.1).toFixed(1),cy:(-w*0.35).toFixed(1),rx:(len*0.18).toFixed(1),ry:0.6,fill:'#fff',opacity:.35},g);
  }
})();
</script>
</body>
</html>
